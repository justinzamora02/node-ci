---
name: Validate

'on':
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Validate YAML formatting
        shell: bash
        env:
          YAMLLINT_CONFIG: |
            extends: default
            rules:
              line-length: disable
        run: |
          set -Eeuo pipefail
          yamllint --strict --config-data "$YAMLLINT_CONFIG" \
            action.yml .github examples

      - name: Validate action metadata
        shell: bash
        env:
          ACTION_VALIDATOR_VERSION: 0.9.0
          ACTION_VALIDATOR_SHA256: 9f42f94fca5b8d04c13bccfbb331104b37a9250650d89ae58dc888d46206f9b9
        run: |
          set -Eeuo pipefail
          executable="${RUNNER_TEMP}/action-validator"
          url="https://github.com/mpalmer/action-validator/releases/download/v${ACTION_VALIDATOR_VERSION}/action-validator_linux_amd64"

          curl --fail --location --silent --show-error \
            --output "$executable" "$url"
          echo "${ACTION_VALIDATOR_SHA256}  ${executable}" | sha256sum --check
          chmod +x "$executable"
          "$executable" action.yml

      - name: Download actionlint
        id: actionlint
        shell: bash
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -Eeuo pipefail
          archive="${RUNNER_TEMP}/actionlint.tar.gz"
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"

          curl --fail --location --silent --show-error \
            --output "$archive" "$url"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" \
            actionlint

          echo "executable=${RUNNER_TEMP}/actionlint" >> "$GITHUB_OUTPUT"
          "$RUNNER_TEMP/actionlint" -version

      - name: Validate GitHub Actions workflows
        shell: bash
        env:
          ACTIONLINT: ${{ steps.actionlint.outputs.executable }}
        run: |
          set -Eeuo pipefail
          "$ACTIONLINT" -color .github/workflows/*.yml examples/*.yml
